<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy 24th Birthday, My Alyyyy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <div class="hearts"></div>

    <main class="container">
      <section class="intro-card">
        <p class="eyebrow">Happy 24th Birthday</p>
        <h1>To the girl who makes my heart sing</h1>
        <p class="intro-copy">
          Open the letter, light the candles, and let this little birthday surprise bloom.
        </p>
      </section>

      <section class="card-stack">
        <article class="panel envelope-panel">
          <div class="panel-title">A sweet little note</div>
          <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="letter">
              <h2>My Future GF Alyy</h2>
              <p id="message"></p>
            </div>
          </div>
          <button id="openBtn">Open Birthday Letter 💌</button>
        </article>

        <article class="panel cake-panel">
          <div class="panel-title">Make a wish</div>
          <div class="scene-hint">
            Tap the cake to add candles. Blow gently or use the button to extinguish them.
          </div>
          <div class="cake-area">
            <div class="candle-count-display" id="candleCount">0 candles glowing</div>
            <div class="cake" id="cake">
              <div class="plate"></div>
              <div class="layer layer-bottom"></div>
              <div class="layer layer-middle"></div>
              <div class="layer layer-top"></div>
              <div class="icing"></div>
              <div class="drip drip1"></div>
              <div class="drip drip2"></div>
              <div class="drip drip3"></div>
            </div>
          </div>
          <div class="action-row">
            <button id="blowBtn" class="secondary-btn">Blow Candles ✨</button>
            <button id="resetBtn" class="secondary-btn">Reset Cake</button>
          </div>
        </article>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
  </body>
</html>
